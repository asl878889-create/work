<title>作業繳交記錄</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：單欄手機工具，上方選班級與科目，四個分頁一次只顯示一頁 */
:root{
  --bg:#FFEFF4; --surface:#FFFFFF; --fg:#4A2B3A; --muted:#8A6074;
  --line:#F7D0DD; --accent:#E8528A; --accent-fg:#FFFFFF; --jade:#7C5CD0; --jade-soft:#F0E9FF;
  --ok-bg:#DDF3E4; --ok-fg:#17603A; --late-bg:#FFEBC2; --late-fg:#7A4E00;
  --mk-bg:#DCE9FF; --mk-fg:#1E4C9E; --no-bg:#FFDCDC; --no-fg:#9C1F1F;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#24161D; --surface:#33212A; --fg:#FFE9F0; --muted:#CDA7B7;
  --line:#4D3341; --accent:#FF8DB4; --accent-fg:#3A0F20; --jade:#BBA4F7; --jade-soft:#3B2F54;
  --ok-bg:#1C4630; --ok-fg:#AEEBC4; --late-bg:#4F3C0E; --late-fg:#FADB8C;
  --mk-bg:#1E3660; --mk-fg:#B9D0FF; --no-bg:#5A2226; --no-fg:#FFB9B9; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#24161D; --surface:#33212A; --fg:#FFE9F0; --muted:#CDA7B7;
  --line:#4D3341; --accent:#FF8DB4; --accent-fg:#3A0F20; --jade:#BBA4F7; --jade-soft:#3B2F54;
  --ok-bg:#1C4630; --ok-fg:#AEEBC4; --late-bg:#4F3C0E; --late-fg:#FADB8C;
  --mk-bg:#1E3660; --mk-fg:#B9D0FF; --no-bg:#5A2226; --no-fg:#FFB9B9; color-scheme:dark }
/* 自選配色：選了之後不跟隨系統深淺色 */
:root[data-pal="berry"],:root[data-pal="peach"],:root[data-pal="mint"],:root[data-pal="lav"]{
  --ok-bg:#DDF3E4; --ok-fg:#17603A; --late-bg:#FFEBC2; --late-fg:#7A4E00;
  --mk-bg:#DCE9FF; --mk-fg:#1E4C9E; --no-bg:#FFDCDC; --no-fg:#9C1F1F; color-scheme:light}
:root[data-pal="berry"]{--bg:#FFEFF4;--surface:#FFFFFF;--fg:#4A2B3A;--muted:#8A6074;--line:#F7D0DD;--accent:#E8528A;--accent-fg:#FFFFFF;--jade:#7C5CD0;--jade-soft:#F0E9FF}
:root[data-pal="peach"]{--bg:#FFF4EA;--surface:#FFFFFF;--fg:#5A3A2E;--muted:#94705F;--line:#F8DCC6;--accent:#E9683F;--accent-fg:#FFFFFF;--jade:#C2496B;--jade-soft:#FFE6D6}
:root[data-pal="mint"]{--bg:#EAF8F4;--surface:#FFFFFF;--fg:#24443F;--muted:#5E817B;--line:#C9EAE1;--accent:#14937D;--accent-fg:#FFFFFF;--jade:#2F6FC4;--jade-soft:#E0EEFF}
:root[data-pal="lav"]{--bg:#F3EEFF;--surface:#FFFFFF;--fg:#382B5C;--muted:#7566A0;--line:#DDD2F7;--accent:#8A63E6;--accent-fg:#FFFFFF;--jade:#C73F86;--jade-soft:#FFE6F3}
:root[data-pal="night"]{--bg:#0B0B0D;--surface:#18171B;--fg:#FFFFFF;--muted:#BCA9B3;--line:#322B30;--accent:#FF8FC0;--accent-fg:#0B0B0D;--jade:#FFB3D4;--jade-soft:#2C1A24;
  --ok-bg:#1C4630; --ok-fg:#AEEBC4; --late-bg:#4F3C0E; --late-fg:#FADB8C;
  --mk-bg:#1E3660; --mk-fg:#B9D0FF; --no-bg:#5A2226; --no-fg:#FFB9B9; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:600px;margin:0 auto;padding-block:12px 104px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
/* 標題旁的小吉祥物 */
.brand{display:flex;align-items:center;gap:14px}
.logo{flex:none}
h1{font-size:24px;margin:0;line-height:1.2;text-wrap:balance}
h2{font-size:15px;margin:0;color:var(--muted);font-weight:500}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pals{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pal{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0;flex:none}
.pal[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}
.note{font-size:13px;color:var(--muted);margin:0}
.note.warn{color:var(--no-fg);font-size:12px}
.pick{display:block}
.pick label,.pick .lbl{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px;min-width:0}
.cls{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.cls button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 0;font-size:16px;font-weight:700}
.cls button[aria-pressed="true"]{background:var(--jade);color:var(--surface);border-color:var(--jade)}
.f{border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:var(--surface);color:var(--fg);min-width:0;max-width:100%}
textarea.f{border-radius:18px;min-height:2.6em;resize:vertical}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px;display:flex;flex-direction:column;gap:8px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 0;font-weight:500;font-size:15px;min-width:0;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
section{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 16px;font-weight:500;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--no-fg)}
.btn:disabled{opacity:.5;cursor:default}
#stuPanel{gap:4px}
#stuPanel h2{margin-bottom:6px}
#stuPanel .item{padding:0}
.x{border:0;background:none;color:var(--jade);padding:7px 8px;margin-right:-8px;line-height:1.3;font-size:14px;font-weight:500;white-space:nowrap}
.item{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.name{flex:1;min-width:0;overflow-wrap:anywhere}
.cur{font-size:12px;background:var(--jade-soft);border-radius:999px;padding:1px 8px;margin-left:6px;white-space:nowrap}
.seg{display:flex;gap:3px;flex:none}
.seg button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 8px;font-size:13px;font-weight:500;white-space:nowrap}
.s-o,.seg button[data-s="o"][aria-pressed="true"]{background:var(--ok-bg);color:var(--ok-fg);border-color:transparent}
.s-l,.seg button[data-s="l"][aria-pressed="true"]{background:var(--late-bg);color:var(--late-fg);border-color:transparent}
.s-m,.seg button[data-s="m"][aria-pressed="true"]{background:var(--mk-bg);color:var(--mk-fg);border-color:transparent}
.s-n,.seg button[data-s="n"][aria-pressed="true"]{background:var(--no-bg);color:var(--no-fg);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.mgrp{display:flex;flex-direction:column;gap:6px}
.srow{display:flex;flex-direction:column;gap:4px;padding:6px 0;border-bottom:1px solid var(--line)}
.srow:last-of-type{border-bottom:0}
.srow b{overflow-wrap:anywhere;font-size:15px}
.srow .chips{gap:4px}
.srow .mchip{padding:1px 9px;font-size:13px}
.mrow2{display:flex;flex-wrap:wrap;gap:0 8px;align-items:baseline;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:16px;padding:6px 12px;text-align:left;width:100%;font-size:15px}
.mrow2.over{background:var(--no-bg);color:var(--no-fg);border-color:transparent}
.mrow2 .mt{font-weight:700}
.mrow2 .mn{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700}
.mrow2 .ms{flex-basis:100%;font-size:13px;opacity:.85;overflow-wrap:anywhere}
.mrow{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mhead{display:flex;gap:8px;align-items:baseline}
.mhead b{font-size:17px}
.mcount{font-variant-numeric:tabular-nums;font-weight:700;color:var(--no-fg)}
.mchip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:500;text-align:left}
.mchip.over{background:var(--no-bg);color:var(--no-fg);border-color:transparent}
.mchip small{font-weight:400;opacity:.85}
.okline{color:var(--ok-fg);background:var(--ok-bg);border-radius:14px;padding:6px 12px;font-weight:500;font-size:14px}
.chip{border-radius:999px;padding:3px 12px;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.due{font-weight:500}
.scroll{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table{border-collapse:separate;border-spacing:0;font-size:14px;width:100%}
th,td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}
thead th{font-weight:500;color:var(--muted);vertical-align:bottom;white-space:nowrap}
thead th .hwh{white-space:normal}
th.stu{position:sticky;left:0;background:var(--surface);text-align:left;white-space:nowrap;font-weight:500;z-index:1}
.hwh{border:0;background:none;padding:0;font-weight:500;color:var(--jade);max-width:6em;min-width:3.2em;overflow-wrap:anywhere;line-height:1.3}
.hwh small{display:block;color:var(--muted);font-weight:400}
.cell{display:inline-block;min-width:2.2em;border-radius:999px;padding:1px 0;font-weight:500}
.miss{font-variant-numeric:tabular-nums;font-weight:700}
dialog{border:1px solid var(--line);border-radius:22px;background:var(--surface);color:var(--fg);padding:20px;width:min(400px,calc(100vw - 32px))}
#fab{position:fixed;z-index:8;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  border:0;border-radius:999px;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:17px;padding:14px 26px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#missDlg{width:min(560px,calc(100vw - 24px));max-height:85vh;overflow:auto;padding:14px}
#missDlg[open]{display:flex;flex-direction:column;gap:12px}
#missPanel,#markPanel{display:flex;flex-direction:column;gap:14px}
.both{display:flex;gap:6px;align-items:center;font-size:15px;margin-left:auto}
.both input{width:18px;height:18px;accent-color:var(--jade);flex:none;margin:0}
#hwAddPanel{gap:8px}
.panel .cls button,#subjSel2 button{padding:4px 0;font-size:15px}
#hwAddPanel .f{padding:4px 12px}
#hwAddPanel .btn{padding:6px 18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{display:flex;flex-direction:column;gap:12px}
dialog label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
dialog h2{color:var(--fg);font-size:18px;font-weight:700}
</style>

<script>
const $ = id => document.getElementById(id);
const el = (tag, props, ...kids) => { const e = Object.assign(document.createElement(tag), props || {}); e.append(...kids); return e; };
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);

/* 狀態代碼：o 準時、l 遲交、m 補交；沒有記錄就是未交（n） */
const ST = [['o','準時','準'],['l','遲交','遲'],['m','補交','補'],['n','未交','缺']];

/* 資料：每個班級是一筆 { name, order, students:[{id,name}], subjects:[{id,name,hw:[{id,title,due,rec:{學生id:代碼}}]}] } */
let classes = {};
let mode = 'loading';              // loading | cloud | local
let db = null;
let cur = store.get('hw-cur', {c: null, s: null, h: null});
const dirty = new Set(), busy = new Set(), failed = new Set(), timers = {};

const FIXED = ['5A', '6A'];         // 固定兩個班級
const SUBJ = ['國', '數', '自', '社'];  // 每班固定四個科目
const clsIds = () => FIXED;
const ensure = obj => {
  FIXED.forEach((id, i) => {
    const c = obj[id] || (obj[id] = {name: id, order: i, students: [], subjects: []});
    c.subjects = SUBJ.map(n => c.subjects.find(x => x.id === n) || {id: n, name: n, hw: []});
  });
  return obj;
};
const C = () => classes[cur.c] || null;
const S = () => { const c = C(); return c ? c.subjects.find(s => s.id === cur.s) || null : null; };
const H = () => { const s = S(); return s ? s.hw.find(h => h.id === cur.h) || null : null; };
const students = c => [...c.students].sort((a, b) => a.name.localeCompare(b.name, 'en', {sensitivity: 'base'}));   // 按字母順序
const fmtDue = d => d ? Number(d.slice(5, 7)) + '/' + Number(d.slice(8, 10)) : '';
/* 期限只選月和日；年份自動取離今天最近的那一年，用來判斷過期了沒 */
function fillMD(m, d, value){
  m.replaceChildren(el('option', {value: '', textContent: '月'}), ...Array.from({length: 12}, (_, i) => el('option', {value: i + 1, textContent: (i + 1) + ' 月'})));
  d.replaceChildren(el('option', {value: '', textContent: '日'}), ...Array.from({length: 31}, (_, i) => el('option', {value: i + 1, textContent: (i + 1) + ' 日'})));
  if (value){ m.value = Number(value.slice(5, 7)); d.value = Number(value.slice(8, 10)); }
}
function mdValue(m, d){
  if (!m.value || !d.value) return '';
  const now = new Date(), mo = Number(m.value), day = Math.min(Number(d.value), new Date(2024, mo, 0).getDate());
  let y = now.getFullYear();
  const diff = (new Date(y, mo - 1, day) - now) / 864e5;
  if (diff > 183) y--; else if (diff < -183) y++;
  return y + '-' + String(mo).padStart(2, '0') + '-' + String(day).padStart(2, '0');
}

/* ---------- 儲存 ---------- */
function setSync(text, warn){
  const p = $('sync'); p.className = 'note' + (warn ? ' warn' : ''); p.replaceChildren(text);
  if (warn && failed.size){
    const b = el('button', {className: 'x', textContent: '再存一次'});
    b.onclick = () => { [...failed].forEach(id => { failed.delete(id); dirty.add(id); flush(id); }); };
    p.append(' ', b);
  }
}
function touch(id){                 // 某個班級的資料改了
  render();
  if (mode === 'local'){ store.set('hw-local', classes); return; }
  if (mode !== 'cloud') return;
  dirty.add(id); failed.delete(id);
  clearTimeout(timers[id]); timers[id] = setTimeout(() => flush(id), 500);
  setSync('儲存中…');
}
async function flush(id){
  if (busy.has(id) || !dirty.has(id)) return;
  dirty.delete(id); busy.add(id);
  try {
    const ref = db.doc('classes/' + id);
    if (classes[id]) await ref.set(JSON.parse(JSON.stringify(classes[id]))); else await ref.delete();
  } catch (e) { failed.add(id); }
  busy.delete(id);
  if (dirty.has(id)) return flush(id);
  if (failed.size) setSync('沒存到，請確認網路。', true);
  else if (!dirty.size && !busy.size) setSync('已儲存');
}
function useLocal(why){
  if (mode === 'local') return;
  mode = 'local'; classes = ensure(store.get('hw-local', {}));
  setSync(why + '記錄只存在這台裝置。', true); render();
}
async function boot(){
  const giveUp = setTimeout(() => useLocal('連不上雲端。'), 10000);
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db){ clearTimeout(giveUp); return useLocal('未登入。'); }
  db.collection('classes').onSnapshot(snap => {
    clearTimeout(giveUp);
    if (mode === 'local') return;
    const next = {};
    snap.docs.forEach(d => { const v = d.data(); if (v) next[d.id] = norm(JSON.parse(JSON.stringify(v))); });   // 複製一份，雲端給的資料不能直接改
    [...dirty, ...busy, ...failed].forEach(id => { if (classes[id]) next[id] = classes[id]; else delete next[id]; });
    ensure(next);
    const first = mode !== 'cloud', same = JSON.stringify(next) === JSON.stringify(classes);
    if (first || !same) classes = next;
    mode = 'cloud';
    if (first) setSync('');
    if (first || !same) render();
  }, () => { clearTimeout(giveUp); useLocal('不是擁有者。'); });
}
function norm(c){
  c.students = Array.isArray(c.students) ? c.students : [];
  c.subjects = Array.isArray(c.subjects) ? c.subjects : [];
  c.subjects.forEach(s => { s.hw = Array.isArray(s.hw) ? s.hw : []; s.hw.forEach(h => { h.rec = h.rec || {}; }); });
  return c;
}

/* ---------- 分頁與配色 ---------- */
const TABS = ['mark', 'all', 'roster'];
const tabs = [...document.querySelectorAll('.tab')];
function showTab(name){
  if (!TABS.includes(name)) name = 'mark';
  tabs.forEach(t => t.setAttribute('aria-selected', t.dataset.tab === name));
  TABS.forEach(id => $(id).hidden = id !== name);
  store.set('hw-tab2', name);
}
tabs.forEach(t => t.onclick = () => { showTab(t.dataset.tab); scrollTo(0, 0); });

const PALS = [['berry','草莓牛奶','#FFEFF4','#E8528A'],['peach','蜜桃奶油','#FFF4EA','#E9683F'],['mint','薄荷蘇打','#EAF8F4','#14937D'],['lav','薰衣草','#F3EEFF','#8A63E6'],['night','夜晚','#0B0B0D','#FF8FC0']];
function setPal(id){
  const p = PALS.find(x => x[0] === id);
  if (p) document.documentElement.dataset.pal = p[0]; else delete document.documentElement.dataset.pal;
  store.set('hw-pal', p ? p[0] : null);
  $('palName').textContent = p ? p[1] : '配色';
  document.querySelectorAll('.pal').forEach(b => b.setAttribute('aria-pressed', !!p && b.dataset.pal === p[0]));
}
PALS.forEach(([id, name, a, b]) => {
  const btn = el('button', {className: 'pal', title: name});
  btn.dataset.pal = id; btn.setAttribute('aria-label', '配色：' + name);
  btn.style.background = `linear-gradient(135deg, ${a} 50%, ${b} 50%)`;
  btn.onclick = () => setPal(document.documentElement.dataset.pal === id ? null : id);
  $('pals').insertBefore(btn, $('palName'));
});

/* ---------- 編輯視窗（改名、改期限、刪除） ---------- */
let dlgSave = null, dlgDelete = null, delArmed = false;
function openEdit({title, fields, note, onSave, onDelete}){
  $('dlgTitle').textContent = title;
  $('dlgFields').replaceChildren(...fields.map(f => {
    if (f.type === 'md'){
      const m = el('select', {className: 'f', id: 'dlg-' + f.key + '-m'}), d = el('select', {className: 'f', id: 'dlg-' + f.key + '-d'});
      m.setAttribute('aria-label', '月份'); d.setAttribute('aria-label', '日期'); fillMD(m, d, f.value);
      return el('div', {className: 'note'}, f.label, el('div', {className: 'row'}, m, d));
    }
    const i = el('input', {className: 'f', type: f.type || 'text', id: 'dlg-' + f.key, value: f.value ?? '', required: f.required !== false});
    return el('label', {}, f.label, i);
  }));
  $('dlgNote').textContent = ''; delArmed = false; $('dlgDel').textContent = '刪除';
  dlgSave = () => onSave(Object.fromEntries(fields.map(f => [f.key, f.type === 'md' ? mdValue($('dlg-' + f.key + '-m'), $('dlg-' + f.key + '-d')) : $('dlg-' + f.key).value.trim()])));
  dlgDelete = onDelete; $('dlgDel').dataset.note = note;
  $('dlg').showModal();
}
$('dlgForm').onsubmit = e => { e.preventDefault(); dlgSave(); $('dlg').close(); };
$('dlgCancel').onclick = () => $('dlg').close();
$('dlgDel').onclick = () => {
  if (!delArmed){ delArmed = true; $('dlgDel').textContent = '確定刪除'; $('dlgNote').textContent = $('dlgDel').dataset.note + '無法復原，再按一次確定。'; return; }
  dlgDelete(); $('dlg').close();
};

/* ---------- 畫面 ---------- */
const hint = text => el('p', {className: 'note', textContent: text});
const jump = (text, tab) => { const b = el('button', {className: 'btn', textContent: text}); b.onclick = () => { $('missDlg').close(); showTab(tab); scrollTo(0, 0); }; return b; };

/* 重畫時保留捲動位置和焦點，避免畫面被帶著跳 */
function render(){
  const y = scrollY, f = document.activeElement && document.activeElement.id;
  draw();
  if (scrollY !== y) scrollTo(0, y);
  if (f){ const e = document.getElementById(f); if (e && e !== document.activeElement) e.focus({preventScroll: true}); }
}
/* 從總覽或缺交清單跳到登記：直接把作業卡片捲到固定列下面 */
function jumpMark(){
  showTab('mark');
  const bar = document.querySelector('.bar'), card = $('markCard');
  scrollTo(0, Math.max(0, card.getBoundingClientRect().top + scrollY - bar.offsetHeight - 8));
}
function draw(){
  if (mode === 'loading') return;
  const ids = clsIds();
  if (!C()) cur.c = ids[0] || null;
  const c = C();
  if (c && !S()) cur.s = c.subjects[0] ? c.subjects[0].id : null;
  if (c && !c.subjects.some(x => x.id === cur.v)) cur.v = cur.s;      // v：總覽頁自己選的科目
  if (c && !c.subjects.some(x => x.id === cur.a)) cur.a = cur.s;      // a：出新作業要加到哪一科（和下面列表的科目 s 分開）
  const s = S();
  if (s && !H()) cur.h = s.hw.length ? s.hw[s.hw.length - 1].id : null;
  const h = s ? H() : null;
  store.set('hw-cur', cur);

  $('classSel').replaceChildren(...ids.map(id => {
    const b = el('button', {textContent: id}); b.setAttribute('aria-pressed', id === cur.c);
    b.onclick = () => { cur = {c: id, s: null, v: cur.v, a: cur.a, h: null}; render(); };
    return b;
  }));
  ['subjSel', 'subjSel2', 'subjSel3'].forEach(id => $(id).replaceChildren(...(c ? c.subjects : []).map(x => {
    const k = id === 'subjSel' ? 'a' : id === 'subjSel2' ? 'v' : 's';
    const b = el('button', {textContent: x.name}); b.setAttribute('aria-pressed', x.id === cur[k]);
    b.onclick = () => { cur[k] = x.id; if (k === 's') cur.h = null; render(); };
    return b;
  })));

  /* 登記 */
  $('hwAddPanel').hidden = !s;
  $('hwBothLbl').textContent = '同時加到 ' + FIXED.find(id => id !== cur.c);
  const mp = $('markPanel'); mp.replaceChildren();
  if (!c) return;
  if (!s) return;
  if (!h) mp.append(el('h2', {textContent: '還沒有作業'}), hint('在上面加入第一份作業。'));
  else {
    const list = students(c);
    const sel = el('select', {className: 'f grow', id: 'hwSel'});
    sel.setAttribute('aria-label', '選擇作業');
    [...s.hw].reverse().forEach(x => sel.append(el('option', {value: x.id, textContent: (x.due ? fmtDue(x.due) + '　' : '') + x.title})));
    sel.value = h.id; sel.onchange = () => { cur.h = sel.value; render(); };
    const edit = el('button', {className: 'btn', textContent: '編輯'});
    edit.onclick = () => openEdit({
      title: '編輯作業',
      fields: [{key: 'title', label: '作業名稱', value: h.title}, {key: 'due', label: '繳交期限（可不填）', type: 'md', value: h.due}],
      note: `會刪除「${h.title}」和全班這份作業的繳交記錄。`,
      onSave: v => { h.title = v.title; h.due = v.due; touch(cur.c); },
      onDelete: () => { s.hw = s.hw.filter(x => x !== h); cur.h = null; touch(cur.c); }
    });
    const n = {o: 0, l: 0, m: 0, n: 0};
    list.forEach(st => n[h.rec[st.id] || 'n']++);
    const today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    const dueText = !h.due ? '沒有設定期限' : '期限 ' + fmtDue(h.due) + (h.due < today ? '（已過）' : h.due === today ? '（今天）' : '');
    mp.append(el('div', {className: 'row'}, sel, edit),
      el('div', {className: 'due', textContent: dueText}),
      el('div', {className: 'chips'}, ...ST.map(([k, label]) => el('span', {className: 'chip s-' + k, textContent: `${label} ${n[k]}`}))));
    if (!list.length) mp.append(el('div', {className: 'row'}, jump('去加入學生', 'roster')));
    else {
      const clear = !n.n;                // 全部都交了就變成「全部設為未交」
      const all = el('button', {className: 'btn', textContent: clear ? '全部設為未交' : '全部設為準時'});
      all.onclick = () => {
        if (clear) list.forEach(st => { delete h.rec[st.id]; });
        else list.forEach(st => { if (!h.rec[st.id]) h.rec[st.id] = 'o'; });
        touch(cur.c);
      };
      const box = el('div');
      list.forEach(st => {
        const now = h.rec[st.id] || 'n';
        const seg = el('div', {className: 'seg'});
        ST.forEach(([k, label]) => {
          const b = el('button', {textContent: label}); b.dataset.s = k; b.setAttribute('aria-pressed', now === k);
          b.onclick = () => { if (k === 'n') delete h.rec[st.id]; else h.rec[st.id] = k; touch(cur.c); };
          seg.append(b);
        });
        box.append(el('div', {className: 'item'}, el('span', {className: 'name', textContent: st.name}), seg));
      });
      mp.append(el('div', {className: 'row'}, all), box);
    }
  }

  /* 缺交：兩個班級、四個科目合在一起看，一位學生一列 */
  const qp = $('missPanel'); qp.replaceChildren();
  const now = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  FIXED.forEach(cid => {
    const k = classes[cid]; if (!k) return;
    const rows = students(k).map(st => {
      const list = [];
      k.subjects.forEach(x => x.hw.forEach(y => { if (!y.rec[st.id]) list.push({x, y, over: !!y.due && y.due < now}); }));
      list.sort((p, q) => (q.over - p.over) || (p.y.due || '9').localeCompare(q.y.due || '9'));
      return {st, list, over: list.filter(i => i.over).length};
    });
    const lacking = rows.filter(r => r.list.length).sort((p, q) => (q.over - p.over) || (q.list.length - p.list.length));
    const done = rows.filter(r => !r.list.length);
    const total = lacking.reduce((n, r) => n + r.list.length, 0), overdue = lacking.reduce((n, r) => n + r.over, 0);
    const head = el('div', {className: 'mhead'}, el('b', {textContent: cid}));
    if (overdue) head.append(el('span', {className: 'chip s-n', textContent: `過期 ${overdue}`}));
    if (total) head.append(el('span', {className: 'chip', style: 'border:1px solid var(--line)', textContent: `未交 ${total}`}));
    const grp = el('div', {className: 'mgrp'}, head);
    if (!k.students.length) grp.append(el('p', {className: 'note', textContent: '還沒有學生'}));
    const groups = [];                 // 缺的作業一模一樣的學生併成一列
    lacking.forEach(r => {
      const sig = r.list.map(i => i.x.id + '/' + i.y.id).join('|'), g = groups.find(q => q.sig === sig);
      if (g) g.names.push(r.st.name); else groups.push({sig, names: [r.st.name], list: r.list});
    });
    groups.forEach(r => {
      const chips = el('div', {className: 'chips'});
      r.list.forEach(({x, y, over}) => {
        const b = el('button', {className: 'mchip' + (over ? ' over' : '')}, `${x.name}・${y.title}`);
        if (y.due) b.append(' ', el('small', {textContent: fmtDue(y.due)}));
        b.onclick = () => { cur.c = cid; cur.s = x.id; cur.h = y.id; $('missDlg').close(); render(); jumpMark(); };
        chips.append(b);
      });
      grp.append(el('div', {className: 'srow'}, el('b', {textContent: r.names.join('、')}), chips));
    });
    if (k.students.length && !lacking.length) grp.append(el('div', {className: 'okline', textContent: '全部交齊'}));
    else if (done.length) grp.append(el('div', {className: 'okline', textContent: '交齊：' + done.map(r => r.st.name).join('、')}));
    qp.append(grp);
  });

  /* 總覽 */
  const sv = c ? c.subjects.find(x => x.id === cur.v) : null;
  const ap = $('allPanel'); ap.replaceChildren();
  if (!sv || !sv.hw.length || !c.students.length) ap.append(hint('還沒有資料。'));
  else {
    const head = el('tr', {}, el('th', {className: 'stu', textContent: '學生'}), el('th', {textContent: '缺交'}));
    sv.hw.forEach(x => {
      const b = el('button', {className: 'hwh'}, x.title, el('small', {textContent: fmtDue(x.due) || '—'}));
      b.onclick = () => { cur.s = sv.id; cur.h = x.id; render(); jumpMark(); };
      head.append(el('th', {}, b));
    });
    const body = el('tbody');
    students(c).forEach(st => {
      const miss = sv.hw.filter(x => !x.rec[st.id]).length;
      const tr = el('tr', {}, el('th', {className: 'stu', textContent: st.name}),
        el('td', {className: 'miss', textContent: miss || ''}));
      sv.hw.forEach(x => { const k = x.rec[st.id] || 'n'; tr.append(el('td', {}, el('span', {className: 'cell s-' + k, textContent: ST.find(t => t[0] === k)[2]}))); });
      body.append(tr);
    });
    ap.append(el('h2', {textContent: `${c.name}・${sv.name}`}), el('div', {className: 'scroll'}, el('table', {}, el('thead', {}, head), body)));
  }

  /* 名單 */
  $('stuAddPanel').hidden = !c;
  const sp = $('stuPanel'); sp.replaceChildren();
  {
    $('stuAddTitle').textContent = '加入學生到 ' + c.name;
    sp.append(el('h2', {textContent: `${c.name} 共 ${c.students.length} 位`}));
    students(c).forEach(st => {
      const b = el('button', {className: 'x', textContent: '編輯'});
      b.onclick = () => openEdit({
        title: '編輯學生',
        fields: [{key: 'name', label: '姓名', value: st.name}],
        note: `會刪除「${st.name}」和這位學生在 ${c.name} 所有科目的繳交記錄。`,
        onSave: v => { st.name = v.name; touch(cur.c); },
        onDelete: () => { c.students = c.students.filter(x => x !== st); c.subjects.forEach(x => x.hw.forEach(y => delete y.rec[st.id])); touch(cur.c); }
      });
      sp.append(el('div', {className: 'item'}, el('span', {className: 'name', textContent: st.name}), b));
    });
  }
}

/* ---------- 操作 ---------- */
const need = input => { if (!input.value.trim()){ input.focus(); return null; } return input.value.trim(); };
$('stuAdd').onclick = () => {
  const c = C(), text = need($('stuList')); if (!c || !text) return;
  text.split('\n').map(l => l.trim()).filter(Boolean).forEach(line => {
    const m = line.match(/^\d+[\s,，、.．:：]*(\S.*)$/);      // 名單前面若帶號碼就去掉
    c.students.push({id: 'p' + uid(), name: m ? m[1].trim() : line});
  });
  $('stuList').value = ''; touch(cur.c);
};
$('hwAdd').onclick = () => {
  const c = C(), s = c && c.subjects.find(x => x.id === cur.a), title = need($('hwTitle')); if (!s || !title) return;
  const due = mdValue($('hwM'), $('hwD'));
  const h = {id: 'h' + uid(), title, due, rec: {}}; s.hw.push(h);
  if ($('hwBoth').checked){            // 同一科也加到另一班
    const oid = FIXED.find(id => id !== cur.c), os = classes[oid] && classes[oid].subjects.find(x => x.id === s.id);
    if (os){ os.hw.push({id: 'h' + uid(), title, due, rec: {}}); touch(oid); }
  }
  if (cur.s === s.id) cur.h = h.id;     // 只有列表正在看同一科時才跳到新作業
  $('hwTitle').value = ''; dueToday(); touch(cur.c);
};
[['hwTitle','hwAdd']].forEach(([i, b]) => $(i).addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) $(b).click(); }));

const dueToday = () => { const n = new Date(); $('hwM').value = n.getMonth() + 1; $('hwD').value = n.getDate(); };   // 期限預設今天
fillMD($('hwM'), $('hwD'), ''); dueToday();
setPal(store.get('hw-pal', null));
showTab(store.get('hw-tab2', 'mark'));
$('fab').onclick = () => $('missDlg').showModal();
$('missClose').onclick = () => $('missDlg').close();
$('missDlg').onclick = e => { if (e.target === $('missDlg')) $('missDlg').close(); };
boot();
</script>
